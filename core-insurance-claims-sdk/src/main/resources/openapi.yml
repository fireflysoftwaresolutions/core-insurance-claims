components:
  schemas:
    ClaimDTO:
      required:
      - claimNumber
      - claimStatus
      - lossDate
      - notifiedAt
      - policyId
      - tenantId
      type: object
      properties:
        claimId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        claimNumber:
          maxLength: 64
          minLength: 0
          type: string
        policyId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        policyTransactionId:
          type: string
          format: uuid
        claimStatus:
          type: string
          enum:
          - NOTIFIED
          - OPEN
          - UNDER_ASSESSMENT
          - RESERVED
          - SETTLED
          - CLOSED
          - REOPENED
          - DENIED
        lossDate:
          type: string
          format: date
        notifiedAt:
          type: string
          format: date-time
        causeCode:
          maxLength: 64
          minLength: 0
          type: string
        description:
          maxLength: 4000
          minLength: 0
          type: string
        currency:
          pattern: "[A-Z]{3}"
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClaimTriageDTO:
      required:
      - claimId
      - triagePath
      - triagedAt
      type: object
      properties:
        claimTriageId:
          type: string
          format: uuid
          readOnly: true
        claimId:
          type: string
          format: uuid
        triagePath:
          type: string
          enum:
          - FAST_TRACK
          - COMPLEX
          - SIU
        triagedAt:
          type: string
          format: date-time
        notes:
          maxLength: 4000
          minLength: 0
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClaimStatusHistoryDTO:
      required:
      - changedAt
      - claimId
      - claimStatus
      type: object
      properties:
        claimStatusHistoryId:
          type: string
          format: uuid
          readOnly: true
        claimId:
          type: string
          format: uuid
        claimStatus:
          type: string
          enum:
          - NOTIFIED
          - OPEN
          - UNDER_ASSESSMENT
          - RESERVED
          - SETTLED
          - CLOSED
          - REOPENED
          - DENIED
        statusReason:
          maxLength: 500
          minLength: 0

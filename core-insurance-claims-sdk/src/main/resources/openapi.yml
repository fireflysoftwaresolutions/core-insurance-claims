openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Claim Denials
  description: Denial recorded by the insurer. This service does not decide coverage.
- name: Claim Assessments
  description: Assessment recorded against a claim
- name: Claim Reserves
  description: Reserve recorded against a claim
- name: Coverage Checks
  description: "Record of the coverage facts checked for a claim: in force, trigger,\
    \ and deductible"
- name: Claim Evidence
  description: Evidence reference on a claim. The document bytes stay in document
    management.
- name: Claim Status History
  description: Status change recorded against a claim
- name: SIU Referrals
  description: Referral of a claim to the special investigations unit
- name: Adjuster Assignments
  description: Adjuster assigned to a claim. The adjuster is a party.
- name: Claims
  description: Claim notification and file
- name: Claim Triage
  description: "Routing of a claim to fast-track, complex handling, or SIU"
- name: Claim Parties
  description: Party role on a claim. The party itself is owned by customer management.
- name: Claim Settlements
  description: "Authorized settlement. Payment execution is a payment order, not this\
    \ record."
- name: Claim Coverages
  description: Coverage on the policy against which the claim is made
- name: Claim Recoveries
  description: "Subrogation, salvage, or contribution pursued on a claim"
- name: Fraud Indicators
  description: Fraud indicator recorded against a claim. Investigation stays with
    the insurer.
paths:
  /api/v1/claims/{claimId}:
    get:
      tags:
      - Claims
      summary: Get Claim by id
      description: Retrieve one Claim
      operationId: getClaimById
      parameters:
      - name: claimId
        in: path
        description: Unique identifier of the Claim
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Claim found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDTO"
        "404":
          description: Claim not found
    put:
      tags:
      - Claims
      summary: Update Claim
      description: Update an existing Claim
      operationId: updateClaim
      parameters:
      - name: claimId
        in: path
        description: Unique identifier of the Claim
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimDTO"
        required: true
      responses:
        "200":
          description: Claim updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDTO"
        "400":
          description: Invalid data
        "404":
          description: Claim not found
    delete:
      tags:
      - Claims
      summary: Delete Claim
      description: Delete a Claim
      operationId: deleteClaim
      parameters:
      - name: claimId
        in: path
        description: Unique identifier of the Claim
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Claim deleted
        "404":
          description: Claim not found
